ext {
    // Was 24 -- bumped for org.jitsi.react:jitsi-meet-sdk (Class Sessions'
    // native video call screen), whose own manifest declares minSdk 26 and
    // fails the build otherwise ("uses-sdk:minSdkVersion 24 cannot be
    // smaller than version 26 declared in library..."). Drops install
    // support for Android 7.x (API 24-25) devices.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}